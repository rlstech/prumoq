name: Build & Deploy

# Publica o PWA (apps/mobile → Worker prumoq-pwa) e o painel admin (apps/admin → Worker prumoq-admin)
# no Cloudflare Workers a cada push no main.
#
# Configurar no GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN (permissão "Workers Scripts: Edit"), CLOUDFLARE_ACCOUNT_ID
#   Variables: EXPO_PUBLIC_POWERSYNC_URL, EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#              EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#              VITE_CLERK_PUBLISHABLE_KEY, VITE_PWA_URL  (ex.: https://prumoq.railton.eu.org)
# Os segredos dos Workers (R2, Clerk, Supabase) ficam no Cloudflare (`wrangler secret put`), não aqui.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy (Workers)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: |
          pnpm -r typecheck
          pnpm --filter @prumoq/admin test

      - name: Build PWA
        run: pnpm --filter @prumoq/mobile build:web
        env:
          EXPO_PUBLIC_POWERSYNC_URL: ${{ vars.EXPO_PUBLIC_POWERSYNC_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # mesma origem: o Worker do PWA serve a própria rota de mídia
          EXPO_PUBLIC_MEDIA_API_URL: ''

      - name: Deploy PWA
        working-directory: apps/mobile
        run: pnpm exec wrangler deploy

      - name: Build admin
        run: pnpm --filter @prumoq/admin build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_PWA_URL: ${{ vars.VITE_PWA_URL }}
          # mesmo domínio (rotas /admin/* e /api/*): rota de mídia relativa
          VITE_MEDIA_API_URL: ''

      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy
